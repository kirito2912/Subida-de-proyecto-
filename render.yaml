services:
  - name: cortinasys-backend
    type: web
    env: python
    branch: main
    buildCommand: cd backend && python -m pip install --upgrade pip setuptools wheel && pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11

      - key: ALLOWED_ORIGINS
        value: "https://tu-app.vercel.app,http://localhost:5173,http://localhost:3000"